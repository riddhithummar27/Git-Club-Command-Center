<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_46');
  if(!container) return;
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
  camera.position.set(0, 0, 18);

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  container.appendChild(renderer.domElement);

  // Lighting: Cinematic studio rim lights
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const mainKeyLight = new THREE.DirectionalLight(0xffffff, 1.4);
  mainKeyLight.position.set(5, 12, 14);
  scene.add(mainKeyLight);

  const orangeRim = new THREE.PointLight(0xf4512c, 6, 40);
  orangeRim.position.set(-8, -4, 10);
  scene.add(orangeRim);

  const cyanAccent = new THREE.PointLight(0x38bdf8, 3, 30);
  cyanAccent.position.set(10, 6, 8);
  scene.add(cyanAccent);

  // Mouse interactive dynamic point light
  const mouseLight = new THREE.PointLight(0xff7744, 4, 25);
  mouseLight.position.set(0, 0, 12);
  scene.add(mouseLight);

  // Master World Group for fluid parallax
  const masterGroup = new THREE.Group();
  scene.add(masterGroup);

  // --- 1. Elegant Central Medallion ---
  const logoGroup = new THREE.Group();
  logoGroup.position.set(0, 4.8, 0);
  logoGroup.scale.set(0.7, 0.7, 0.7);
  masterGroup.add(logoGroup);

  // Texture loader for logo
  const textureLoader = new THREE.TextureLoader();
  const logoTexture = textureLoader.load('/gitclub_logo.png');
  logoTexture.generateMipmaps = true;
  logoTexture.minFilter = THREE.LinearMipmapLinearFilter;
  logoTexture.center.set(0.5, 0.5);
  logoTexture.rotation = -Math.PI / 2;

  // Sophisticated Materials
  const outerBevelMat = new THREE.MeshStandardMaterial({
    color: 0x1f1f23,
    metalness: 0.85,
    roughness: 0.25
  });

  const rimGoldMat = new THREE.MeshStandardMaterial({
    color: 0xf4512c,
    metalness: 0.7,
    roughness: 0.3,
    emissive: 0x220500
  });

  const logoFaceMat = new THREE.MeshStandardMaterial({
    map: logoTexture,
    color: 0xdddddd,
    metalness: 0.2,
    roughness: 0.8,
    transparent: true
  });

  const darkBackMat = new THREE.MeshStandardMaterial({
    color: 0x111113,
    metalness: 0.9,
    roughness: 0.2
  });

  // Disc geometry
  const discGeo = new THREE.CylinderGeometry(2.35, 2.35, 0.28, 64);
  discGeo.rotateX(Math.PI / 2);
  const discMesh = new THREE.Mesh(discGeo, [rimGoldMat, logoFaceMat, darkBackMat]);
  logoGroup.add(discMesh);

  // Thin futuristic chamfer ring around disc
  const chamferGeo = new THREE.TorusGeometry(2.42, 0.04, 16, 100);
  const chamferMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
  const chamferMesh = new THREE.Mesh(chamferGeo, chamferMat);
  logoGroup.add(chamferMesh);

  // Elegant nested orbital gimbal rings
  const ring1Geo = new THREE.TorusGeometry(3.3, 0.035, 16, 120);
  const ring1Mat = new THREE.MeshBasicMaterial({ color: 0xf4512c, transparent: true, opacity: 0.55 });
  const ring1 = new THREE.Mesh(ring1Geo, ring1Mat);
  ring1.rotation.x = Math.PI / 3.2;
  logoGroup.add(ring1);

  const ring2Geo = new THREE.TorusGeometry(3.9, 0.025, 16, 120);
  const ring2Mat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4 });
  const ring2 = new THREE.Mesh(ring2Geo, ring2Mat);
  ring2.rotation.y = Math.PI / 3;
  logoGroup.add(ring2);

  // Precision Git Branch Nodes (satellites)
  const satelliteGroup = new THREE.Group();
  logoGroup.add(satelliteGroup);
  const satelliteCount = 4;
  const satellites = [];
  for (let i = 0; i < satelliteCount; i++) {
    const angle = (i / satelliteCount) * Math.PI * 2;
    const rad = 4.3;
    const satMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.16, 16, 16),
      new THREE.MeshStandardMaterial({
        color: i % 2 === 0 ? 0xf4512c : 0xffffff,
        emissive: i % 2 === 0 ? 0x441100 : 0x222222,
        roughness: 0.2,
        metalness: 0.8
      })
    );
    satelliteGroup.add(satMesh);
    satellites.push({ mesh: satMesh, baseAngle: angle, radius: rad, speed: 0.6 + i * 0.15 });
  }

  // --- 2. Minimalist Constellation Matrix (Ambient Tech Particles) ---
  const particleCount = 45;
  const particlesGroup = new THREE.Group();
  masterGroup.add(particlesGroup);

  const pGeo = new THREE.BoxGeometry(0.18, 0.18, 0.18);
  const pMat1 = new THREE.MeshStandardMaterial({ color: 0xf4512c, roughness: 0.3, metalness: 0.7 });
  const pMat2 = new THREE.MeshStandardMaterial({ color: 0x2a2a30, roughness: 0.4, metalness: 0.8 });
  const particles = [];

  for (let i = 0; i < particleCount; i++) {
    const mesh = new THREE.Mesh(pGeo, i % 3 === 0 ? pMat1 : pMat2);
    const px = (Math.random() - 0.5) * 32;
    const py = (Math.random() - 0.5) * 18;
    const pz = (Math.random() - 0.5) * 14 - 3;
    mesh.position.set(px, py, pz);
    mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    mesh.userData = {
      origX: px,
      origY: py,
      origZ: pz,
      rotSpeedX: (Math.random() - 0.5) * 0.02,
      rotSpeedY: (Math.random() - 0.5) * 0.02,
      floatSpeed: 0.5 + Math.random() * 0.8,
      phase: Math.random() * Math.PI * 2
    };
    particlesGroup.add(mesh);
    particles.push(mesh);
  }

  // Clean connect lines
  const lineMat = new THREE.LineBasicMaterial({ color: 0xf4512c, transparent: true, opacity: 0.12 });
  const linesGeo = new THREE.BufferGeometry();
  const linePositions = new Float32Array(particleCount * 6);
  linesGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
  const lineSegments = new THREE.LineSegments(linesGeo, lineMat);
  masterGroup.add(lineSegments);

  // Cursor tracking physics
  let mouseX = 0, mouseY = 0;
  let targetX = 0, targetY = 0;

  function onMouseMove(e) {
    const rect = container.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    targetX = (x / rect.width - 0.5) * 2;
    targetY = (y / rect.height - 0.5) * 2;
  }
  window.addEventListener('mousemove', onMouseMove);

  function onResize() {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', onResize);

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();

    // Smooth lerp
    mouseX += (targetX - mouseX) * 0.06;
    mouseY += (targetY - mouseY) * 0.06;

    // Cinematic Parallax tilt on scene
    masterGroup.rotation.y = mouseX * 0.45;
    masterGroup.rotation.x = -mouseY * 0.35;
    masterGroup.position.x = mouseX * 0.8;
    masterGroup.position.y = -mouseY * 0.6;

    // Dynamic light follows cursor smoothly
    mouseLight.position.set(mouseX * 12, -mouseY * 8, 10);

    // Logo floating & gyroscopic rotation
    logoGroup.position.y = 3.2 + Math.sin(time * 1.5) * 0.2;
    logoGroup.rotation.y = time * 0.4 + mouseX * 0.7;
    logoGroup.rotation.x = Math.sin(time * 0.9) * 0.08 - mouseY * 0.5;

    ring1.rotation.z = time * 0.35;
    ring1.rotation.y = Math.sin(time * 0.5) * 0.25;
    ring2.rotation.z = -time * 0.4;
    ring2.rotation.x = Math.PI / 3 + Math.cos(time * 0.6) * 0.2;

    // Satellite orbiting
    satellites.forEach((sat, i) => {
      const curA = sat.baseAngle + time * sat.speed;
      sat.mesh.position.x = Math.cos(curA) * sat.radius;
      sat.mesh.position.y = Math.sin(curA) * sat.radius;
      sat.mesh.position.z = Math.sin(curA * 1.5 + i) * 0.8;
    });

    // Micro particle drift & subtle cursor repulsion
    const posArr = lineSegments.geometry.attributes.position.array;
    let lineIdx = 0;

    for (let i = 0; i < particleCount; i++) {
      const p = particles[i];
      p.rotation.x += p.userData.rotSpeedX;
      p.rotation.y += p.userData.rotSpeedY;

      const tOffset = time * p.userData.floatSpeed + p.userData.phase;
      p.position.y = p.userData.origY + Math.sin(tOffset) * 0.4;
      p.position.x = p.userData.origX + Math.cos(tOffset * 0.8) * 0.3;

      // Repulsion from mouse in 3D
      const dx = p.position.x - (mouseX * 10);
      const dy = p.position.y - (-mouseY * 7);
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 6.0) {
        const push = (6.0 - dist) / 6.0;
        p.position.x += (dx / dist) * push * 0.5;
        p.position.y += (dy / dist) * push * 0.5;
      }
    }

    // Update a few subtle connection lines
    for (let i = 0; i < 20; i++) {
      const pA = particles[i];
      const pB = particles[(i + 2) % particleCount];
      posArr[lineIdx++] = pA.position.x;
      posArr[lineIdx++] = pA.position.y;
      posArr[lineIdx++] = pA.position.z;
      posArr[lineIdx++] = pB.position.x;
      posArr[lineIdx++] = pB.position.y;
      posArr[lineIdx++] = pB.position.z;
    }
    lineSegments.geometry.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
  }

  animate();

})();
</script>

<!-- Interactive Silk-Smooth Tilt Script -->
<script>
    (function initTiltInteractivity() {
      const card = document.getElementById('interactive-text-wrapper');
      const ambientLight = document.getElementById('ambient-light');
      
      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let targetRotX = 0;
      let targetRotY = 0;
      let curRotX = 0;
      let curRotY = 0;

      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;

        if (ambientLight) {
          ambientLight.style.left = `${mouseX}px`;
          ambientLight.style.top = `${mouseY}px`;
        }

        const halfW = window.innerWidth / 2;
        const halfH = window.innerHeight / 2;

        const normX = (mouseX - halfW) / (halfW || 1);
        const normY = (mouseY - halfH) / (halfH || 1);

        // Apple / Stripe caliber micro-perspective tilt: subtle & refined
        targetRotY = normX * 12;  // max 12 deg
        targetRotX = -normY * 10; // max 10 deg
      });

      function renderLoop() {
        curRotX += (targetRotX - curRotX) * 0.08;
        curRotY += (targetRotY - curRotY) * 0.08;

        if (card) {
          card.style.transform = `
            rotateX(${curRotX.toFixed(2)}deg) 
            rotateY(${curRotY.toFixed(2)}deg) 
            translateZ(20px)
          `;
        }

        requestAnimationFrame(renderLoop);
      }
      requestAnimationFrame(renderLoop);
    })();
  </script>
