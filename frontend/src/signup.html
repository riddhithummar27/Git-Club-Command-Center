
<div class="min-h-screen w-full flex items-center justify-center bg-surface-container-lowest p-4">
  <div class="max-w-md w-full bg-surface-container rounded-2xl shadow-xl overflow-hidden">
    
    <div class="px-space-lg py-space-xl flex flex-col items-center">
      <img src="/gitclub_logo.png" alt="Git Club" class="w-20 h-20 object-contain mb-4 filter drop-shadow-md" />
      <h1 class="font-headline-lg text-headline-lg text-on-surface font-bold text-center mb-1">Create an Account</h1>
      <p class="font-body-md text-body-md text-on-surface-variant text-center mb-8">Join the Git Club Command Center</p>

      <form class="w-full space-y-space-md" onsubmit="handleEmailAuth(event)">
        <div class="space-y-1">
          <label class="font-label-mono-sm text-label-mono-sm text-on-surface-variant uppercase tracking-wider block ml-1">Email Address</label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none">mail</span>
            <input type="email" id="emailInput" required class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-surface-container-low text-on-surface font-body-md border border-surface-container-highest focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-outline" placeholder="student@charusat.edu.in" />
          </div>
        </div>

        <div class="space-y-1">
          <label class="font-label-mono-sm text-label-mono-sm text-on-surface-variant uppercase tracking-wider block ml-1">Password</label>
          <div class="relative flex items-center">
            <span class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none">lock</span>
            <input type="password" id="passInput" required class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-surface-container-low text-on-surface font-body-md border border-surface-container-highest focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-outline" placeholder="••••••••" />
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full py-2.5 rounded-lg bg-primary-container text-on-primary-container font-title-md font-bold hover:brightness-110 shadow-sm transition-all flex items-center justify-center gap-2">
            <span id="email-btn-text">Sign Up</span>
            <span class="material-symbols-outlined text-[20px]">person_add</span>
          </button>
        </div>
      </form>
      
      <div class="w-full mt-6 text-center">
        <p class="text-sm text-on-surface-variant">Already have an account? <a href="#" onclick="window.dispatchEvent(new CustomEvent('force-navigate', { detail: { path: '/login' } })); return false;" class="text-primary hover:underline">Log in here</a></p>
      </div>

      <div class="w-full flex items-center gap-4 my-6 opacity-60">
        <div class="flex-1 h-[1px] bg-outline"></div>
        <span class="font-label-mono-sm text-[10px] text-on-surface uppercase tracking-widest">OR</span>
        <div class="flex-1 h-[1px] bg-outline"></div>
      </div>

      <div class="w-full flex flex-col gap-3">
        <button onclick="handleGoogleLogin(event)" class="w-full py-2.5 rounded-lg bg-surface-container-high text-on-surface font-title-md font-bold hover:brightness-110 shadow-sm transition-all flex items-center justify-center gap-3 border border-outline-variant">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          <span id="google-login-text">Continue with Google</span>
        </button>
        
        <button onclick="handleGithubLogin(event)" class="w-full py-2.5 rounded-lg bg-surface-container-high text-on-surface font-title-md font-bold hover:brightness-110 shadow-sm transition-all flex items-center justify-center gap-3 border border-outline-variant">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.379.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.416 22 12c0-5.523-4.477-10-10-10z" fill="white"/>
          </svg>
          <span id="github-login-text">Continue with GitHub</span>
        </button>
      </div>
    </div>
    
  </div>
</div>

<script>
  window.handleEmailAuth = async function(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    const textSpan = btn.querySelector('#email-btn-text');
    const originalText = textSpan.innerText;
    const email = document.getElementById('emailInput').value;
    const pass = document.getElementById('passInput').value;
    
    textSpan.innerHTML = 'Authenticating...';
    btn.classList.add('opacity-80', 'cursor-not-allowed');
    
    try {
      if (window.firebaseSignUpEmail) {
        await window.firebaseSignUpEmail(email, pass);
      } else {
        throw new Error("Firebase auth not initialized yet");
      }
      window.dispatchEvent(new CustomEvent('force-navigate', { detail: { path: '/dashboard' } }));
    } catch (err) {
      console.error(err);
      textSpan.innerHTML = 'Sign Up Failed';
      if (err.code === 'auth/email-already-in-use') {
        alert("This email is already registered. Please log in.");
      } else if (err.code === 'auth/weak-password') {
        alert("Password should be at least 6 characters.");
      }
      setTimeout(() => {
        textSpan.innerHTML = originalText;
        btn.classList.remove('opacity-80', 'cursor-not-allowed');
      }, 3000);
    }
  };

  window.handleGoogleLogin = async function(e) {
    e.preventDefault();
    const btn = e.currentTarget;
    const textSpan = btn.querySelector('#google-login-text');
    const originalText = textSpan.innerText;
    
    textSpan.innerHTML = 'Authenticating...';
    btn.classList.add('opacity-80', 'cursor-not-allowed');
    
    try {
      if (window.firebaseLoginGoogle) {
        await window.firebaseLoginGoogle();
        window.dispatchEvent(new CustomEvent('force-navigate', { detail: { path: '/dashboard' } }));
      } else {
        throw new Error("Firebase auth not initialized yet");
      }
    } catch (err) {
      console.error(err);
      textSpan.innerHTML = 'Authentication Failed';
      setTimeout(() => {
        textSpan.innerHTML = originalText;
        btn.classList.remove('opacity-80', 'cursor-not-allowed');
      }, 3000);
    }
  };
  
  window.handleGithubLogin = async function(e) {
    e.preventDefault();
    const btn = e.currentTarget;
    const textSpan = btn.querySelector('#github-login-text');
    const originalText = textSpan.innerText;
    
    textSpan.innerHTML = 'Authenticating...';
    btn.classList.add('opacity-80', 'cursor-not-allowed');
    
    try {
      if (window.firebaseLoginGithub) {
        await window.firebaseLoginGithub();
        window.dispatchEvent(new CustomEvent('force-navigate', { detail: { path: '/dashboard' } }));
      } else {
        throw new Error("Firebase auth not initialized yet");
      }
    } catch (err) {
      console.error(err);
      textSpan.innerHTML = 'Authentication Failed';
      setTimeout(() => {
        textSpan.innerHTML = originalText;
        btn.classList.remove('opacity-80', 'cursor-not-allowed');
      }, 3000);
    }
  };
</script>
