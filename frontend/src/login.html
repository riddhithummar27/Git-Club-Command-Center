
<div class="min-h-screen w-full flex items-center justify-center bg-surface-container-lowest p-4">
  <div class="max-w-md w-full bg-surface-container rounded-2xl shadow-xl overflow-hidden">
    
    <div class="px-space-lg py-space-xl flex flex-col items-center">
      <img src="/gitclub_logo.png" alt="Git Club" class="w-20 h-20 object-contain mb-4 filter drop-shadow-md" />
      <h1 class="font-headline-lg text-headline-lg text-on-surface font-bold text-center mb-1">Welcome Back</h1>
      <p class="font-body-md text-body-md text-on-surface-variant text-center mb-8">Sign in to access the Git Club Command Center</p>

      <div class="w-full pt-4 flex flex-col gap-4">
        <button onclick="handleGoogleLogin(event)" class="w-full py-3 rounded-lg bg-surface-container-high text-on-surface font-title-md font-bold hover:brightness-110 shadow-sm transition-all flex items-center justify-center gap-3 border border-outline-variant">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          <span id="login-text">Sign in with Google</span>
        </button>
      </div>
    </div>
    
    <div class="bg-surface-container-low px-space-lg py-space-sm border-t border-surface-container-highest text-center">
      <span class="font-label-mono-sm text-label-mono-sm text-outline">SECURE INTRA-NETWORK PORTAL</span>
    </div>

  </div>
</div>

<script>
  window.handleGoogleLogin = async function(e) {
    e.preventDefault();
    const btn = e.currentTarget;
    const textSpan = btn.querySelector('#login-text');
    const originalText = textSpan.innerText;
    
    textSpan.innerHTML = 'Authenticating...';
    btn.classList.add('opacity-80', 'cursor-not-allowed');
    
    try {
      if (window.firebaseLogin) {
        await window.firebaseLogin();
        window.dispatchEvent(new CustomEvent('force-navigate', { detail: { path: '/dashboard' } }));
      } else {
        throw new Error("Firebase auth not initialized yet");
      }
    } catch (err) {
      console.error(err);
      textSpan.innerHTML = 'Authentication Failed';
      setTimeout(() => {
        textSpan.innerHTML = originalText;
        btn.classList.remove('opacity-80', 'cursor-not-allowed');
      }, 3000);
    }
  };
</script>
